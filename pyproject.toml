[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcat"
dynamic = ["version"]
description = "Python port of CRCat: rational-polynomial fitting and the catalog of all RLC networks with up to five elements"
authors = [
    { name = "Volker Muehlhaus", email = "volker@muehlhaus.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mpmath",
    "numpy",
    "scikit-rf",
]

[project.scripts]
crcat-seed = "crcat.seed:main"
crcat-netlist = "crcat.cli_netlist:main"

[project.gui-scripts]
crcat-gui = "crcat.gui:main"

[project.optional-dependencies]
plot = ["matplotlib"]
fast = ["gmpy2"]
gui = ["PySide6-Essentials", "matplotlib"]
dev = ["pytest", "sympy", "mat-io", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crcat = ["data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "crcat.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: catalog validation, full catalog searches (about 1.5 minutes in all)"]
addopts = "-m 'not slow'"
